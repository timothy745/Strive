<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Strive - Latihan</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      font-family: 'Khand', sans-serif;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      display: block;
    }

    body {
      opacity: 0;
      animation: fadeIn 0.5s forwards;
      overflow-y: scroll;
      overflow-x: hidden;
      min-height: 100vh;
      background: #ffffff;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .fade-out {
      animation: fadeOut 0.5s forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
      }
    }

    /* ── Scrolling Background ── */
    #background {
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    #background .bg-track {
      display: flex;
      width: 200%;
      height: 100%;
      gap: 30px;
      animation: bgScroll 180s linear infinite;
    }

    #background .bg-track img {
      width: calc(50% - 15px);
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
    }

    @keyframes bgScroll {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    /* ── White Overlay ── */
    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1;
    }

    /* ═══════════════════════════════════════
       ORIGINAL HEADER — exact from other pages
       ═══════════════════════════════════════ */
    .card {
      position: sticky;
      top: 0;
      width: 1536px;
      max-width: 100%;
      height: 100px;
      margin: 0 auto;
      background: linear-gradient(90deg, #000242 0%, #000499 51%, #0005D6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }

    .card .logo {
      position: absolute;
      width: 160px;
      height: 160px;
      bottom: 255px;
      left: 20px;
      top: 1%;
      transform: translateY(-50%);
      z-index: 5;
    }

    .card .logo img {
      width: 160px;
      height: 160px;
      display: block;
    }

    .card .profile-pic {
      position: absolute;
      width: 85px;
      height: 80px;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
    }

    .card .profile-pic button {
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 50%;
      width: 80px;
      height: 80px;
    }

    .card .profile-pic img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    .card .profile-pic img:hover {
      transform: scale(1.1);
      transition: transform 0.3s ease;
      transform: opacity 0.8s ease;
      opacity: 0.8;
    }

    .full {
      width: 100%;
    }

    .btn {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
    }

    .btn button {
      width: 264px;
      height: 100px;
      border-radius: 0px;
      border: none;
      background: linear-gradient(90deg, #01036E 0%, #0106D4 100%);
      color: white;
      font-size: 30px;
      cursor: pointer;
      transform: skewX(-25deg);
      z-index: 2;
    }

    .btn button span {
      display: inline-block;
      transform: skewX(25deg);
    }

    .btn button:hover {
      transform: color ease-in-out 0.1s;
      background: #ffffff;
      color: #2C30E2;
    }

    .btn button:active {
      transform: color ease-in-out 0.1s;
      background: #ffffff;
      color: #2C30E2;
    }

    /* ═══════════════════════════════════════
       SCROLLABLE CONTENT
       ═══════════════════════════════════════ */
    .scroll-content {
      position: relative;
      z-index: 2;
      padding: 28px 24px 60px;
      max-width: 1320px;
      margin: 0 auto;
    }

    /* ── Search Bar (part of top bar) ── */
    .search-bar {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      padding: 10px 8% 14px;
      position: sticky;
      top: 100px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      clip-path: url(#trap-rounded);
      overflow: hidden;
    }

    .search-bar .search-icon {
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      flex-shrink: 0;
    }

    .search-bar input {
      flex: 1;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 0 16px;
      font-size: 17px;
      font-family: 'Khand', sans-serif;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      letter-spacing: 0.3px;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-bar input:focus {
      border-color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.15);
    }

    .search-bar input::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .search-bar .search-icon {
      color: #000499;
      font-size: 20px;
      flex-shrink: 0;
      opacity: 0.6;
    }

    .search-bar input {
      flex: 1;
      height: 38px;
      border: 2px solid #dde0ec;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 16px;
      font-family: 'Khand', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8f8ff;
      color: #1a1a2e;
      letter-spacing: 0.3px;
    }

    .search-bar input:focus {
      border-color: #000499;
      box-shadow: 0 0 0 3px rgba(0, 4, 153, 0.1);
    }

    .search-bar input::placeholder {
      color: #aab0c0;
    }

    /* ── Main Video Card ── */
    .main-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: inset 0px 0px 50px 3px rgba(0, 0, 0, 0.25);
      padding: 32px;
      overflow: hidden;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    /* ── Video Thumbnail ── */
    .video-thumb {
      border-radius: 14px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c8cad8 0%, #e8eaf0 60%, #d0d2de 100%);
      aspect-ratio: 16 / 10;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .video-thumb video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      border-radius: 14px;
    }

    /* ── Overlay & Hover Animations (PRESERVED ORIGINAL) ── */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 2, 66, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.3s ease;
      z-index: 2;
      border-radius: 14px;
    }

    .video-thumb:hover .video-overlay {
      background: rgba(0, 2, 66, 0.65);
    }

    .video-thumb:hover {
      transform: scale(1.04);
      box-shadow: 0 4px 18px rgba(0, 0, 150, 0.18);
    }

    .video-overlay .video-label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 17px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.3s ease, transform 0.3s ease;
      text-align: center;
      padding: 0 10px;
    }

    .video-thumb:hover .video-label {
      color: #ffffff;
      transform: scale(1.05);
    }

    .video-play-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .video-play-icon::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-left: 16px solid #ffffff;
      margin-left: 4px;
    }

    .video-thumb:hover .video-play-icon {
      background: #ffffff;
      transform: scale(1.1);
    }

    .video-thumb:hover .video-play-icon::after {
      border-left-color: #000499;
    }

    .video-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.28);
      color: #fff;
      font-size: 13px;
      font-family: 'Khand', sans-serif;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 3;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ── No Results ── */
    .no-results {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      grid-column: 1 / -1;
      padding: 60px 20px;
      color: #999;
      font-size: 20px;
      text-align: center;
      gap: 12px;
    }

    .no-results i {
      font-size: 48px;
      opacity: 0.3;
    }

    /* ── Loading Overlay ── */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .loading-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 6px solid #e0e0e0;
      border-top: 6px solid #2C30E2;
      border-radius: 50%;
      animation: loadingSpin 0.8s linear infinite;
    }

    @keyframes loadingSpin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* ── Video Modal ── */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-modal.active {
      opacity: 1;
      pointer-events: all;
    }

    .video-modal-content {
      background: linear-gradient(135deg, #000242 0%, #000499 100%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 850px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .video-modal.active .video-modal-content {
      transform: scale(1);
    }

    .video-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    .video-modal-title {
      font-size: 28px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin: 0;
    }

    .video-modal-close {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .video-modal-close:hover {
      background: #ffffff;
      color: #000499;
      transform: scale(1.1);
    }

    .video-modal-body {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .video-modal-body video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.35);
    }

    /* ── Responsive ── */
    @media (max-width: 1100px) {
      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .btn button {
        width: 200px;
        font-size: 24px;
      }
    }

    @media (max-width: 700px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      .btn button {
        width: 140px;
        font-size: 18px;
      }
    }
  </style>
</head>

<script>
  function pindah1() {
    document.body.classList.add("fade-out");
    setTimeout(() => { window.location.href = "beranda.html"; }, 500);
  }
  function pindah2() {
    document.body.classList.add("fade-out");
    setTimeout(() => { window.location.href = "latihan.html"; }, 500);
  }
  function pindah3() {
    document.body.classList.add("fade-out");
    setTimeout(() => { window.location.href = "statistik.html"; }, 500);
  }
  function pindah4() {
    document.body.classList.add("fade-out");
    setTimeout(() => { window.location.href = "jadwal.html"; }, 500);
  }

  // ── Search Filter ──
  function filterVideos() {
    const query = document.getElementById('search-input').value.toLowerCase().trim();
    const items = document.querySelectorAll('.video-thumb');
    const noResults = document.getElementById('no-results');
    let count = 0;

    items.forEach(item => {
      const label = item.querySelector('.video-label').textContent.toLowerCase();
      const match = label.includes(query);
      item.style.display = match ? '' : 'none';
      if (match) count++;
    });

    if (noResults) {
      noResults.style.display = count === 0 ? 'flex' : 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    showLoading();
    try {
      const user = await window.striveAPI.getCurrentUser();
      hideLoading();
      if (user && user.profile_pic) {
        document.getElementById('header-profile-pic').src = user.profile_pic;
      }
    } catch (e) { console.error(e); hideLoading(); }

    const modal = document.getElementById('video-modal');
    if (modal) {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeVideoModal();
      });
    }

    const searchInput = document.getElementById('search-input');
    if (searchInput) {
      searchInput.addEventListener('input', filterVideos);
    }
  });

  function showLoading() {
    let overlay = document.getElementById('loading-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'loading-overlay';
      overlay.className = 'loading-overlay';
      overlay.innerHTML = '<div class="loading-spinner"></div>';
      document.body.appendChild(overlay);
    }
    overlay.classList.add('active');
  }
  function hideLoading() {
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.classList.remove('active');
  }

  function openVideoModal(videoSrc, videoTitle) {
    const modal = document.getElementById('video-modal');
    const modalTitle = document.getElementById('video-modal-title');
    const modalVideo = document.getElementById('video-modal-player');
    const modalSource = document.getElementById('video-modal-source');

    modalTitle.textContent = videoTitle;
    modalSource.src = videoSrc;
    modalVideo.load();
    modal.classList.add('active');
    modalVideo.play().catch(err => console.log('Autoplay blocked:', err));
  }

  function closeVideoModal() {
    const modal = document.getElementById('video-modal');
    const modalVideo = document.getElementById('video-modal-player');
    modal.classList.remove('active');
    modalVideo.pause();
  }
</script>

<body>
  <svg style="width:0;height:0;position:absolute;">
    <clipPath id="trap-rounded" clipPathUnits="objectBoundingBox">
      <path d="M 0.02,0 L 0.98,0 Q 1,0 1,0.02 L 0.92,0.98 Q 0.92,1 0.90,1 L 0.10,1 Q 0.08,1 0.08,0.98 L 0,0.02 Q 0,0 0.02,0 Z"/>
    </clipPath>
  </svg>
  <!-- ── Scrolling Background ── -->
  <div id="background">
    <div class="bg-track">
      <img src="BackgroundStrive.png" alt="Background">
      <img src="BackgroundStrive.png" alt="Background">
    </div>
  </div>

  <!-- ═══════════════ STICKY HEADER ═══════════════ -->
  <div class="card">
    <div class="logo">
      <img src="Strive.png" alt="Strive">

    <div class="btn">
      <button onclick="pindah1()"><span>BERANDA</span></button>
      <button onclick="pindah2()"><span>LATIHAN</span></button>
      <button onclick="pindah3()"><span>STATISTIK</span></button>
      <button onclick="pindah4()"><span>JADWAL</span></button>

          alt="Profile Picture"></button>

  <!-- ── Search Bar ── -->

    <i class="fas fa-search search-icon"></i>
    <input id="search-input" type="text" placeholder="Cari latihan..." autocomplete="off">
  </div>

  <!-- ═══════════════ SCROLLABLE CONTENT ═══════════════ -->
  <div class="scroll-content">

    <!-- ── Video Grid ── -->
    <div class="main-card">
      <div class="video-grid">
        <div class="video-thumb" onclick="openVideoModal('PushUp.mp4', 'Push Up')">

        <div class="video-thumb" onclick="openVideoModal('PullUp.mp4', 'Pull Up')">

            <div class="video-play-icon"></div>
            <div class="video-label">Pull Up</div>
          </div>
          <span class="video-duration">1:00</span>
        </div>

        <div class="video-thumb" onclick="openVideoModal('AngkatBarbel.mp4', 'Angkat Barbel')">
          <video width="100%" height="100%" poster="AngkatBarbel.jpeg" muted>
            <source src="AngkatBarbel.mp4" type="video/mp4">
          </video>
          <div class="video-overlay">
            <div class="video-play-icon"></div>
            <div class="video-label">Angkat Barbel</div>
          </div>
          <span class="video-duration">0:55</span>
        </div>

        <div class="video-thumb" onclick="openVideoModal('LompatTali.mp4', 'Lompat Tali')">
          <video width="100%" height="100%" poster="LompatTali.jpeg" muted>
            <source src="LompatTali.mp4" type="video/mp4">
          </video>
          <div class="video-overlay">
            <div class="video-play-icon"></div>
            <div class="video-label">Lompat Tali</div>
          </div>
          <span class="video-duration">0:40</span>
        </div>

        <div class="video-thumb" onclick="openVideoModal('mountainclimbing.mp4', 'Mountain Climber')">
          <video width="100%" height="100%" poster="MountainClimber.jpeg" muted>
            <source src="mountainclimbing.mp4" type="video/mp4">
          </video>
          <div class="video-overlay">
            <div class="video-play-icon"></div>
            <div class="video-label">Mountain Climber</div>
          </div>
          <span class="video-duration">1:30</span>
        </div>

        <div class="video-thumb" onclick="openVideoModal('SQUAT.mp4', 'Squat')">
          <video width="100%" height="100%" poster="squat.jpeg" muted>
            <source src="SQUAT.mp4" type="video/mp4">
          </video>
          <div class="video-overlay">
            <div class="video-play-icon"></div>
            <div class="video-label">Squat</div>
          </div>
          <span class="video-duration">1:30</span>
        </div>

         <div class="video-thumb" onclick="openVideoModal('situp.mp4', 'situp')">
           <video width="100%" height="100%" poster="situp.jpeg" muted>
             <source src="situp.mp4" type="video/mp4">
           </video>
           <div class="video-overlay">
             <div class="video-play-icon"></div>
             <div class="video-label">Sit Up</div>
           </div>
           <span class="video-duration">1:30</span>

            <div class="video-thumb" onclick="openVideoModal('jumpingjack.mp4', 'Jumping Jacks')">
          <video width="100%" height="100%" poster="jumpingjack.jpeg" muted>
            <source src="jumpingjack.mp4" type="video/mp4">
          </video>
          <div class="video-overlay">
            <div class="video-play-icon"></div>
            <div class="video-label">Jumping Jacks</div>
          </div>
          <span class="video-duration">1:30</span>
        </div>

       <div class="video-thumb" onclick="openVideoModal('backup.mp4', 'Back Up')">
           <video width="100%" height="100%" poster="backup.jpeg" muted>
             <source src="backup.mp4" type="video/mp4">
           </video>
           <div class="video-overlay">
             <div class="video-play-icon"></div>
             <div class="video-label">Back Up</div>
